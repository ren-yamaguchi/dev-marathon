<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Detail</title>
    <!-- Bootstrap CSSの読み込み -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">顧客詳細</h1>
      <dl class="row" id="customer-detail">
        <dt class="col-sm-3">会社名</dt>
        <dd class="col-sm-9" data-field="company_name"></dd>
        <dt class="col-sm-3">業種</dt>
        <dd class="col-sm-9" data-field="industry"></dd>
        <dt class="col-sm-3">連絡先</dt>
        <dd class="col-sm-9" data-field="contact"></dd>
        <dt class="col-sm-3">所在地</dt>
        <dd class="col-sm-9" data-field="location"></dd>
      </dl>
      <a href="list.html" class="btn btn-secondary">一覧に戻る</a>
    </div>

    <script type="module">
      import config from "../config.js";

      const id = new URLSearchParams(location.search).get("id");

      fetch(`${config.apiUrl}/customers`)
        .then((response) => response.json())
        .then((data) => {
          const customer = data.find((c) => String(c.customer_id) === id);
          if (!customer) {
            document.getElementById("customer-detail").innerHTML =
              "<dd>該当する顧客が見つかりませんでした。</dd>";
            return;
          }
          document.querySelectorAll("[data-field]").forEach((el) => {
            el.textContent = customer[el.dataset.field];
          });
        })
        .catch((error) => console.error(error));
    </script>

    <!-- BootstrapのJavaScriptと依存関係のリンク -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
